[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pfd-dispersion"
version = "1.0.0"
description = "Petersson-Frisch Dispersion (PFD) calculator for two-body and three-body dispersion energies"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Barbaro Zulueta", email = "baz14@pitt.edu"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
keywords = [
    "dispersion",
    "DFT",
    "density functional theory",
    "quantum chemistry",
    "computational chemistry",
    "PFD",
    "Axilrod-Teller-Muto",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/BLZ11/pfd_dispersion"
Repository = "https://github.com/BLZ11/pfd_dispersion"
"Bug Tracker" = "https://github.com/BLZ11/pfd_dispersion/issues"

[project.scripts]
pfd-calc = "pfd_calculator:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pfd*"]
